name: Test

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  offline-test:
    name: Go 1.26 offline test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # These tests use network fixtures or httptest only; actual remote
      # provider/API calls and Docker-backed PostgreSQL are explicit opt-ins.
      METATUBE_LIVE_TEST: "0"
      METATUBE_DOCKER_TEST: "0"
      OPENAI_TRANSLATION_INTEGRATION: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: go.mod
          cache: true

      - name: Verify Go version
        run: go version

      - name: Run all offline unit and fixture tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run race-sensitive offline suites
        run: |
          go test -race -count=2 \
            ./internal/requestpolicy \
            ./internal/flaresolverr \
            ./provider/internal/scraper \
            ./provider/internal/sitehtml \
            ./provider/javlibrary \
            ./provider/javdb \
            ./common/fetch \
            ./translate/openai \
            ./route \
            ./engine
